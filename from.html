<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="from.css" />
  </head>
  <body>
    <form class="action">
      <div>
        <label for="email">Email </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        />
      </div>

      <div>
        <label for="age">Age </label>
        <input type="number" id="age" name="age" placeholder="Enter your age" />
      </div>
      <div>
        <label for="num">Number </label>
        <input
          type="number"
          id="num"
          name="num"
          placeholder="Enter your number"
        />
      </div>

      <div>
        <label for="password">Password </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
        />
      </div>

      <div>
        <label for="datetime">Date and Time </label>
        <input type="datetime-local" id="datetime" name="datetime" />
      </div>

      <div>
        <label for="time">Time</label>
        <input type="time" id="time" name="time" />
      </div>

      <div>
        <label for="date">date</label>
        <input type="date" id="date" name="date" />
      </div>

      <div>
        <label for="file">File</label>
        <input type="file" id="file" name="file" />
      </div>

      <div>
        <label for="range">Range</label>
        <input type="range" id="range" name="range" min="0" max="100" />
      </div>
      
    <div>
      <label for="">Gender:</label>
      <input type="radio" name="gender" value="male" checked id="male">
      <label for="male">Male</label>
      <input type="radio" name="gender" value="female" id="female">
      <label for="female">female</label>
      <input type="radio" name="gender" value="other" id="other">
      <label for="other">Other</label>
    </div>

    <div>
      <input type="checkbox" name="hobby" value="reading">
      <label for="hobby">Reading</label>
      <input type="checkbox" name="hobby" value="writing">
      <label for="hobby">Writing</label>
      <input type="checkbox" name="hobby" value="coding">
      <label for="hobby">Coding</label>
    </div>

    
   <div>
    <label for="select">Select:</label>
    <select name="select" id="select">
      <option value="option1">Option 1</option>
      <option value="option2">Option 2</option>
      <option value="option3">Option 3</option>
    </select>
   </div>
   <div>
    <label for="message">Message:</label>
    <textarea id="message" name="message" placeholder="Enter your message"></textarea>
   </div>
   <div>
    <input type="submit" class="submit-button" value="Submit" />
   </div>
    
    </form>
  </body>
</html>
