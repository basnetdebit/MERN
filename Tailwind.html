<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailwind css</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- color:text-{color}-  -->
     <!-- background color  -->
    <h1 class="text-green-900 bg-green-500">
        Hello world 
    </h1>
    <!-- Background gradient:bg-gradient<diretion> from-{color}-{shade} to- {color}--{shade}-->
    <h2 class="bg-gradient-to-r from-gray-500 to-red-600 text-white">Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque, officia.</h2>
    
    <!-- Typegraphy -->
     <!-- font size xs,sm,md,lg,lx, xl,2x1 ,2x1, 4x1 ....9x1-->
      <!-- font weight: light, medium, semibold, bold  -->
       <!-- text alignment : left, center , justify  -->
    
         <!-- tracking : tracking-tighter, tighter, normal, wide, wider, widest -->
          <!-- tex decoration : underline, line-through , overline  -->
    <p class="text-3x1  font-semibold  leading-5 decoration-1.2rem" >Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo, quam!</p>
 <!-- spacing : margin & padding  -->
  <!-- Mardin : m -->
<!-- Padding :p  -->
 <!-- top :t , Bottom:b , left:l ,right:r, horizontal:x , vertical:y  -->
  <h2 class="bg-red-500 m-5 p-3 my-10 pl-8">hello nepal </h2>
  <!-- height & width : h-{size} , w-{size} -->
   <div class="bg-blue-500 h-50 w-600 w-1/2"> box</div>

</body>
</html>
