<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>tailwind css</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- color:text-{color}-  -->
     <!-- background color  -->
    <h1 class="text-green-900 bg-green-500">
        Hello world 
    </h1>
    <!-- Background gradient:bg-gradient<diretion> from-{color}-{shade} to- {color}--{shade}--> -->

    <!-- Typegraphy -->
     <!-- text size xs,sm,md,lg,lx, -->
    <p class="text-p">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo, quam!</p>
</body>
</html>
